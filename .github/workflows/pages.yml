name: Deploy site to GitHub Pages

# Builds _site/ on every push to main and deploys it to GitHub Pages.
# While Pages is not enabled for the repository (Settings > Pages > Source: GitHub Actions),
# only the build job does anything: the deploy job is skipped, so nothing fails and nothing is published.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node tools/build.mjs
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository; the site was built but not deployed."
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
